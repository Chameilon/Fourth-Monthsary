<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7e8ed">
  <meta name="robots" content="noindex, nofollow"> <!-- asks search engines not to list this page -->
  <title>For My Baby — 4th Monthsary ♡</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js");</script>
  <style>
    /* ============ COLORS & BASICS ============ */
    :root {
      --berry: #78485d;
      --rose: #ad7188;
      --pink: #bd718b;
      --blush: #f8eaf0;
      --petal: #f7dce5;
      --pale: #fff8fa;
      --cream: #fffdfd;
      --ink: #684b59;
      --muted: #927987;
      --shadow: 0 18px 50px rgba(120, 72, 93, .14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 70px; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--pale);
      background-image: radial-gradient(#e9cbd6 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ============ SCROLL PROGRESS (a little cat rides the bar!) ============ */
    .progress { position: fixed; top: 0; left: 0; width: 100%; height: 5px; z-index: 60; background: rgba(255,255,255,.25); }
    .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, #f7a8c4, #bd718b, #78485d); border-radius: 0 6px 6px 0; }
    .progress-cat { position: fixed; top: 6px; left: 0; font-size: 1.15rem; z-index: 60; pointer-events: none; line-height: 1; }

    /* ============ TOP BAR ============ */
    .topbar {
      position: fixed; z-index: 50; top: 0; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      padding: 26px clamp(20px, 7vw, 90px) 20px; color: white;
      transition: background .3s, color .3s, padding .3s, box-shadow .3s;
    }
    .topbar.scrolled {
      background: rgba(255, 248, 250, .88); backdrop-filter: blur(12px);
      color: var(--berry); padding-top: 18px; padding-bottom: 12px;
      box-shadow: 0 6px 24px rgba(120, 72, 93, .1);
    }
    .brand { font-family: "Playfair Display", serif; font-size: 1.2rem; letter-spacing: .04em; }
    .brand span { color: #f2b9b4; transition: color .3s; }
    .topbar.scrolled .brand span { color: var(--pink); }
    .nav { display: flex; gap: 8px; font-size: .82rem; font-weight: 600; }
    .nav a { padding: 6px 12px; border-radius: 99px; opacity: .92; transition: background .2s, transform .2s; }
    .nav a:hover { background: rgba(255,255,255,.2); transform: translateY(-2px); }
    .topbar.scrolled .nav a:hover { background: var(--petal); }

    /* ============ HERO ============ */
    .hero {
      min-height: 760px; height: 100svh; max-height: 960px; position: relative;
      display: grid; place-items: center; text-align: center; color: white;
      padding: 110px 22px 80px; overflow: hidden;
      background:
        linear-gradient(115deg, rgba(91, 49, 70, .38), rgba(174, 112, 139, .22)),
        url("https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=2000&q=85") center center / cover no-repeat;
    }
    .hero::before, .hero::after {
      content: ""; position: absolute; border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%; width: 480px; height: 480px; pointer-events: none;
    }
    .hero::before { top: -260px; left: -170px; }
    .hero::after { bottom: -320px; right: -130px; width: 650px; height: 650px; }
    .hero-content { position: relative; z-index: 2; max-width: 780px; }
    .eyebrow {
      display: inline-block; border: 1px solid rgba(255,255,255,.45);
      padding: 9px 17px; border-radius: 99px; letter-spacing: .16em;
      text-transform: uppercase; font-size: .68rem; margin-bottom: 27px;
      background: rgba(255,255,255,.1); backdrop-filter: blur(8px);
    }
    h1 {
      font: 600 clamp(3.3rem, 9vw, 7.2rem)/.98 "Playfair Display", serif;
      margin: 0; letter-spacing: -.045em; text-shadow: 0 6px 30px rgba(91, 49, 70, .35);
    }
    h1 em {
      font-weight: 600;
      background: linear-gradient(90deg, #ffd1e1, #fff, #ffb7cf, #fff, #ffd1e1);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite; text-shadow: none;
    }
    @keyframes shimmer { to { background-position: -250% 0; } }
    .hero-copy { max-width: 540px; margin: 27px auto 32px; color: rgba(255,255,255,.92); line-height: 1.8; font-size: 1rem; }
    .hero-button {
      display: inline-block; padding: 14px 26px; background: #ffe5ed; color: var(--berry);
      border-radius: 99px; font-weight: 700; font-size: .88rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.14);
      animation: wiggle 3.5s ease-in-out infinite;
      transition: background .2s, box-shadow .2s;
    }
    .hero-button:hover { background: white; animation-play-state: paused; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
    @keyframes wiggle {
      0%, 80%, 100% { transform: rotate(0) scale(1); }
      86% { transform: rotate(-4deg) scale(1.06); }
      92% { transform: rotate(4deg) scale(1.06); }
    }

    /* floating cute things in the hero */
    .floating { position: absolute; z-index: 1; animation: drift 5s ease-in-out infinite; opacity: .92; transition: translate .25s ease-out; }
    .f1 { top: 24%; left: 12%; font-size: 2.2rem; }
    .f2 { top: 31%; right: 13%; font-size: 1.6rem; animation-delay: -2s; }
    .f3 { bottom: 19%; left: 18%; font-size: 1.4rem; animation-delay: -1s; }
    .f4 { bottom: 23%; right: 17%; font-size: 2rem; animation-delay: -3s; }
    .f5 { top: 17%; right: 28%; font-size: 1.5rem; animation-delay: -1.5s; }
    .f6 { top: 46%; left: 6%; font-size: 1.7rem; animation-delay: -2.5s; }
    .f7 { top: 52%; right: 7%; font-size: 1.5rem; animation-delay: -.5s; }
    @keyframes drift { 0%,100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translateY(-14px) rotate(8deg); } }

    /* hearts & paws that float up the hero */
    .hero-bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
    .rise { position: absolute; bottom: -40px; opacity: 0; animation: rise var(--dur, 8s) linear forwards; }
    @keyframes rise {
      0% { transform: translate(0, 0) scale(.6); opacity: 0; }
      10% { opacity: .85; }
      100% { transform: translate(35px, -960px) scale(1.1); opacity: 0; }
    }

    /* the bear & cat sitting in the hero corners */
    .pal { position: absolute; bottom: 34px; z-index: 2; cursor: pointer; text-align: center; }
    .pal-left { left: clamp(12px, 8vw, 120px); }
    .pal-right { right: clamp(12px, 8vw, 120px); }
    .pal-face { display: block; font-size: clamp(3.4rem, 8vw, 5.6rem); line-height: 1; animation: bob 2.6s ease-in-out infinite; transition: transform .25s; }
    .pal-right .pal-face { animation-delay: -1.3s; }
    .pal:hover .pal-face { transform: scale(1.15) rotate(-6deg); }
    .pal-bubble {
      position: relative; display: inline-block; margin-bottom: 12px; padding: 6px 14px;
      background: #fff; color: var(--berry); border-radius: 16px;
      font: 700 1.15rem/1.1 "Caveat", cursive; box-shadow: 0 8px 20px rgba(0,0,0,.15);
      animation: bubblepop 4s ease-in-out infinite;
    }
    .pal-right .pal-bubble { animation-delay: -2s; }
    .pal-bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 2px; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes bubblepop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

    /* ============ SECTIONS (with scalloped, cake-like edges) ============ */
    .section { padding: 100px 22px; position: relative; background: var(--bg, #fff); }
    .section::before, .final-section::before {
      content: ""; position: absolute; left: 0; right: 0; top: -13px; height: 14px; z-index: 1; pointer-events: none;
      background: radial-gradient(circle at 50% 100%, var(--bg) 13.5px, transparent 14.5px) 0 0 / 28px 14px repeat-x;
    }
    .note-section { --bg: #fffdfd; }
    .media-section { --bg: #f8eaf0; }
    .surprise-section { --bg: #fff3f6; }
    .moments { --bg: #f8eaf0; }
    .promise-section { --bg: #fffdfd; }
    .wrap { width: min(1050px, 100%); margin: auto; }
    .center { text-align: center; }
    .section-tag { color: #b66e88; text-transform: uppercase; letter-spacing: .2em; font-size: .7rem; font-weight: 700; }
    .section-title { font: 600 clamp(2.3rem, 5vw, 3.8rem)/1.1 "Playfair Display", serif; color: var(--berry); margin: 13px 0 18px; }
    .intro { max-width: 610px; color: var(--muted); line-height: 1.85; margin: 0 auto; }
    .diary-stamp {
      display: inline-block; margin: 0 0 16px; padding: 4px 16px;
      border: 2px dashed #d7a1b5; border-radius: 999px;
      color: #a76780; background: #fff8fa; font: 700 1.1rem "Caveat", cursive;
      letter-spacing: .04em; transform: rotate(-2deg);
    }

    /* peeking bears & cats that sit on top of the cards */
    .peeker { display: flex; align-items: flex-end; position: absolute; top: -2.9rem; left: 28px; font-size: 3.1rem; line-height: 1; z-index: 3; transform-origin: bottom center; animation: peek 3.4s ease-in-out infinite; pointer-events: none; }
    .peeker.right { left: auto; right: 28px; animation-delay: -1.2s; }
    .peeker.center { left: 50%; translate: -50% 0; }
    @keyframes peek { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(4deg); } }

    /* gentle reveal as you scroll */
    .js .reveal {
      opacity: 0; translate: 0 28px;
      transition: opacity .7s ease var(--d, 0s), translate .7s ease var(--d, 0s), transform .25s ease, box-shadow .25s ease;
    }
    .js .reveal.in { opacity: 1; translate: 0 0; }

    /* ============ NOTE SECTION ============ */
    .note-layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 65px; align-items: center; }
    .photo-frame {
      position: relative; padding: 13px; background: white; border-radius: 190px 190px 22px 22px;
      box-shadow: var(--shadow); transform: rotate(-2deg);
    }
    .photo-frame:hover { transform: rotate(0) scale(1.02); }
    .photo-frame::before {
      content: ""; position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; z-index: 2;
      transform: translateX(-50%) rotate(-3deg); border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
      background: repeating-linear-gradient(45deg, rgba(247,184,206,.88) 0 8px, rgba(255,255,255,.8) 8px 16px);
    }
    .photo-frame img { display: block; width: 100%; height: 490px; object-fit: cover; border-radius: 180px 180px 15px 15px; }
    .photo-caption {
      position: absolute; bottom: -18px; right: -25px; background: var(--petal); color: #87474a;
      padding: 15px 21px; border-radius: 50%; font: italic 1.1rem "Playfair Display", serif; transform: rotate(8deg);
    }
    .sticker { position: absolute; font-size: 2.1rem; z-index: 3; animation: drift 5s ease-in-out infinite; }
    .s1 { top: 70px; right: -16px; }
    .s2 { left: -16px; bottom: 110px; animation-delay: -2s; }
    .letter {
      background: linear-gradient(#fff, #fffafb); padding: clamp(27px, 5vw, 48px); border-radius: 8px 28px 28px 28px;
      box-shadow: var(--shadow); position: relative; border: 1px solid #f0dce4;
    }
    .letter::before { content: "♡"; position: absolute; top: -23px; right: 28px; color: var(--pink); font-size: 2.5rem; animation: pulse 2.2s ease-in-out infinite; }
    .letter h3 { font: italic 1.7rem "Playfair Display", serif; color: var(--pink); margin: 0 0 18px; }
    .letter p { color: #7a5a69; line-height: 1.95; font-size: .96rem; }
    .signature { font: 700 1.9rem "Caveat", cursive; color: var(--berry); margin-top: 25px; }

    /* ============ MEMORIES (polaroid-style cards) ============ */
    .media-grid { display: grid; grid-template-columns: minmax(0, 400px); justify-content: center; margin-top: 62px; }
    .media-card { position: relative; background: white; padding: 14px 14px 10px; border-radius: 20px; box-shadow: var(--shadow); text-align: left; }
    .media-card:nth-child(1) { transform: rotate(-1.2deg); }
    .media-card:hover { transform: rotate(0) scale(1.02); box-shadow: 0 24px 60px rgba(120,72,93,.22); }
    .media-card h3 { font: 600 1.3rem "Playfair Display", serif; margin: 12px 8px 5px; color: var(--berry); }
    .media-card p { margin: 0 8px 12px; color: var(--muted); font-size: .85rem; line-height: 1.6; }
    .media-card video { display: block; width: auto; max-width: 100%; height: auto; max-height: min(72vh, 640px); margin: 0 auto; border-radius: 14px; background: #f3dce5; }

    /* ============ SURPRISE ============ */
    .surprise-card {
      position: relative; max-width: 760px; margin: 62px auto 0; padding: clamp(28px, 6vw, 58px);
      background: white; border-radius: 28px; box-shadow: var(--shadow); text-align: center;
      border: 2px dashed #f0c3d4;
    }
    .envelope { font-size: 2.6rem; margin-bottom: 8px; display: inline-block; animation: wiggle 3s ease-in-out infinite; }
    .surprise-button {
      border: 0; cursor: pointer; display: inline-block; padding: 15px 28px; margin: 10px 0 22px; border-radius: 99px;
      background: linear-gradient(135deg, #c77b97, #a96580); color: white; font: 700 .95rem "DM Sans", sans-serif;
      box-shadow: 0 8px 20px rgba(169, 101, 128, .3); transition: transform .2s, background .2s;
    }
    .surprise-button:hover { transform: translateY(-3px) scale(1.04); background: var(--berry); }
    .surprise-button:active { transform: scale(.96); }
    .hidden-letter { display: none; margin-top: 12px; padding: 28px; background: #fff8fa; border: 1px dashed #e4b9ca; border-radius: 18px; text-align: left; animation: reveal .55s ease both; }
    .hidden-letter.show { display: block; }
    .hidden-letter h3 { font: italic 1.8rem "Playfair Display", serif; color: var(--pink); margin: 0 0 15px; }
    .hidden-letter p {
      color: #7a5a69; white-space: pre-line; margin: 0;
      font-size: 1rem; line-height: 32px;
      background-image: repeating-linear-gradient(transparent 0 31px, #f3d9e2 31px 32px);
      background-attachment: local;
    }
    .audio-note { font-size: .8rem; color: var(--muted); margin: 8px 0 0; }
    .song-toggle { margin-top: 10px; border: 1px solid #e4b9ca; background: #fff8fa; color: var(--berry); border-radius: 99px; padding: 7px 16px; font-weight: 600; font-size: .8rem; cursor: pointer; }
    .song-toggle:hover { background: var(--petal); }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ============ MOMENT CARDS ============ */
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 48px; }
    .moment-card {
      border: 1px solid #f6dce6; border-radius: 26px; padding: 30px 25px; min-height: 220px;
      box-shadow: 0 8px 24px rgba(173, 113, 136, .08);
    }
    .moment-card:nth-child(1) { background: linear-gradient(160deg, #fff, #ffeaf2); }
    .moment-card:nth-child(2) { background: linear-gradient(160deg, #fff, #fff0e6); }
    .moment-card:nth-child(3) { background: linear-gradient(160deg, #fff, #f3ecff); }
    .moment-card:hover { transform: translateY(-8px) rotate(-1deg); box-shadow: var(--shadow); }
    .moment-icon { display: inline-grid; place-items: center; width: 68px; height: 68px; background: #fff; border-radius: 50%; font-size: 2rem; box-shadow: 0 8px 20px rgba(173,113,136,.18); }
    .moment-card:hover .moment-icon { animation: wiggle-icon .6s ease; }
    @keyframes wiggle-icon { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg) scale(1.1); } 75% { transform: rotate(14deg) scale(1.1); } }
    .moment-card h3 { font: 600 1.35rem "Playfair Display", serif; color: var(--berry); margin: 17px 0 9px; }
    .moment-card p { color: var(--muted); line-height: 1.75; font-size: .9rem; margin: 0; }

    /* ============ PROMISE ============ */
    .promise-box {
      max-width: 790px; margin: 72px auto 0; padding: 42px clamp(25px, 6vw, 65px);
      background: #fbe8ee; border-radius: 28px; text-align: center; position: relative;
    }
    .promise-box::before, .promise-box::after { content: "✿"; color: var(--pink); font-size: 2.1rem; position: absolute; }
    .promise-box::before { top: 18px; left: 22px; }
    .promise-box::after { bottom: 18px; right: 22px; }
    .promise-box p { font: italic clamp(1.35rem, 3vw, 2rem)/1.6 "Playfair Display", serif; color: var(--berry); margin: 0; }
    .little-things { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    .pill { padding: 10px 16px; border-radius: 99px; background: #fff8fa; border: 1px solid #f2dce5; color: #8c5870; font-size: .8rem; font-weight: 600; transition: transform .2s, background .2s; cursor: default; }
    .pill:hover { transform: translateY(-4px) rotate(-3deg); background: var(--petal); }

    /* ============ FINAL ============ */
    .final-section {
      --bg: #78485d;
      text-align: center; color: white; padding: 100px 22px 75px;
      background: var(--bg); position: relative;
    }
    .final-section .section-title { color: white; }
    .final-section p { color: rgba(255,255,255,.82); line-height: 1.8; }
    .big-heart { color: #f0b9b4; font-size: 3.2rem; margin: 20px 0; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.13); } }
    .twinkle { position: absolute; color: #ffd6e4; animation: twinkle 3s ease-in-out infinite; pointer-events: none; }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.2); } }
    .hug-bear { margin-top: 28px; border: 0; background: rgba(255,255,255,.1); width: 104px; height: 104px; border-radius: 50%; font-size: 3.6rem; line-height: 1; cursor: pointer; transition: background .2s, transform .2s; }
    .hug-bear:hover { background: rgba(255,255,255,.2); transform: scale(1.06); }
    .hug-bear.squish { animation: squish .45s ease; }
    @keyframes squish { 0% { transform: scale(1); } 30% { transform: scale(1.25, .75); } 60% { transform: scale(.85, 1.2); } 100% { transform: scale(1); } }
    .hug-text { font: 700 1.4rem "Caveat", cursive; margin: 10px 0 0; }
    .footer { color: rgba(255,255,255,.6); font-size: .75rem; margin-top: 55px; letter-spacing: .08em; }
    .tiny { color: var(--pink); }

    /* ============ WALKING CATS & BEARS ============ */
    .critter-layer { position: fixed; left: 0; right: 0; bottom: 0; height: 0; z-index: 40; pointer-events: none; }
    .critter {
      position: absolute; bottom: 4px; left: 0; border: 0; background: none; padding: 0;
      font-size: 2.6rem; line-height: 1; cursor: pointer; pointer-events: auto; will-change: transform;
    }
    .critter .flip, .critter .bob { display: block; }
    .critter .bob { animation: waddle .5s ease-in-out infinite; }
    .critter.paused .bob { animation: breathe 2s ease-in-out infinite; }
    .critter.hop .bob { animation: hop .6s ease; }
    @keyframes waddle { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-6px) rotate(6deg); } }
    @keyframes br
